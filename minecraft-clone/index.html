<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft Clone - Advanced Web Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/PointerLockControls.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-900 text-white font-roboto overflow-hidden">
  <div id="ui" class="absolute top-0 left-0 w-full p-4 z-50">
    <div id="instructions" class="text-center text-lg mb-4">
      Click to play. Use WASD to move, mouse to look around, left click to remove blocks, right click to place blocks.
    </div>
    <div id="inventory" class="flex justify-center space-x-4">
      <!-- Inventory slots will be dynamically added here -->
    </div>
  </div>
  <div id="game-container" class="w-full h-full"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
